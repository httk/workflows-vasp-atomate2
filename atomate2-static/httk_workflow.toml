[workflow]
name = "atomate2.static"
description = "atomate2's StaticMaker: one VASP single-point calculation of a structure, with atomate2's input set and custodian error handling"
declaration_uri = "https://raw.githubusercontent.com/httk/workflows-vasp-atomate2/refs/tags/wf-decl-v0.1.0/atomate2-static/declaration.json"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1", "atomate2>=0.1.5"]

[workflow.runner]
format = "jobflow"
maker = "atomate2.vasp.jobs.core:StaticMaker"

[workflow.inputs.structure]
port = "structure"
role = "initial_structure"
entry_type = "structures"
required = true

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The total energy of the structure: the final ionic step's energy(sigma->0), in eV."
product_of = "initial_structure"

[workflow.outputs.band_gap]
entry_type = "records"
role = "band_gap"
ref = "https://schemas.httk.org/defs/v0.1/properties/electronic/band_gap"
description = "The band gap of the structure, in eV."
product_of = "initial_structure"

[workflow.outputs.task_document]
entry_type = "files"
role = "task_document"
description = "jobflow-outputs.json: the final atomate2 task document (an emmet TaskDoc) as JSON."
product_of = "initial_structure"

[workflow.collect]
file = "collect.py"

[workflow.postprocess.report]
file = "scripts/report"
description = "writes report.txt and report.json (energy, band gap, band edges, Fermi level, magnetization)"

[workflow.postprocess.plots]
file = "scripts/plots"
description = "dos.png: total and element-projected density of states from the run's vasprun.xml"
