[build-system]
requires = []
build-backend = "workflow_repository_build"
backend-path = ["tools"]

[project]
name = "workflows-vasp-atomate2"
dynamic = ["version"]
description = "atomate2's VASP Makers as httk workflows (static, relax, tight relax, double relax, band structure, dielectric, elastic, phonons)"
requires-python = ">=3.12"
dependencies = ["httk-workflow>=2.1.1", "httk-atomistic>=2.1.2", "httk-analyse>=2.1.0", "atomate2>=0.1.5", "phonopy>=2.20", "seekpath>=2.0"]

[project.optional-dependencies]
dispatcher = ["httk-workflow-vasp>=0.1.0"]

[tool.httk.workflow-repository]
repository = "git+https://github.com/httk/workflows-vasp-atomate2"

[tool.ruff]
target-version = "py312"
src = ["tests"]
line-length = 120
